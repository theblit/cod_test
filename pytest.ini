[pytest]
DJANGO_SETTINGS_MODULE = cooldeal.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
testpaths = tests
addopts = -v --tb=short --strict-markers
markers =
    django_db: marque un test comme ayant besoin de la base de données Django
    integration: test d'intégration
    unit: test unitaire
